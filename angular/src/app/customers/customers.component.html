<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">{{ '::Menu:Customers' | abpLocalization }}</h5>
      </div>
      <div class="text-end col col-md-6">
        <button *abpPermission="'BookStore.Customers.Create'" class="btn btn-primary" (click)="openCreate()" type="button">
          <i class="fa fa-plus me-1"></i>
          {{ '::NewCustomer' | abpLocalization }}
        </button>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable
      [rows]="customer.items"
      [count]="customer.totalCount"
      [list]="list"
      default
    >
      <ngx-datatable-column [name]="'Code' | abpLocalization" prop="code"></ngx-datatable-column>
      <ngx-datatable-column [name]="'Name' | abpLocalization" prop="name"></ngx-datatable-column>
      <ngx-datatable-column [name]="'Cpf' | abpLocalization" prop="cpf"></ngx-datatable-column>
      <ngx-datatable-column [name]="'DateOfBirth' | abpLocalization">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.dateOfBirth | date: 'shortDate' }}
        </ng-template>
      </ngx-datatable-column>
      
      <ngx-datatable-column 
        [name]="'Actions' | abpLocalization" 
        [maxWidth]="250"
        [sortable]="false">
        
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button 
                class="btn btn-primary btn-sm dropdown-toggle" 
                data-toggle="dropdown"
                aria-haspopup="true"
                ngbDropdownToggle>
                    <i class="fa fa-cog me-1"></i>{{ 'Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button *abpPermission="'BookStore.Customers.Edit'" ngbDropdownItem (click)="openEdit(row.id)">
                {{ 'Edit' | abpLocalization }}
              </button>
              <button *abpPermission="'BookStore.Customers.Delete'" ngbDropdownItem (click)="delete(row.id)">
                {{ 'Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selectedCustomerId ? 'EditCustomer' : 'NewCustomer') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" *ngIf="form">
      <div class="mb-3">
        <label>{{ 'Code' | abpLocalization }}</label>
        <input class="form-control" formControlName="code" />
      </div>
      <div class="mb-3">
        <label>{{ 'Cpf' | abpLocalization }}</label>
        <input class="form-control" formControlName="cpf" />
      </div>
      <div class="mb-3">
        <label>{{ 'Name' | abpLocalization }}</label>
        <input class="form-control" formControlName="name" />
        <small
          class="text-danger"
          *ngIf="form.get('name')?.touched && form.get('name')?.hasError('minlength')"
        >
          {{ 'NameMinLengthError' | abpLocalization }}
        </small>
      </div>
      <div class="mb-3">
        <label>{{ 'DateOfBirth' | abpLocalization }}</label>
        <input 
            #datepicker="ngbDatepicker"
            class="form-control" 
            formControlName="dateOfBirth"
            ngbDatepicker
            (click)="datepicker.toggle()" />
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" (click)="isModalOpen = false">
      {{ 'Cancel' | abpLocalization }}
    </button>
    <button type="button" class="btn btn-primary" (click)="save()">
      {{ 'Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
